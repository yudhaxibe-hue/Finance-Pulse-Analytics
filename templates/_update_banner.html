<div class="update-banner" id="desktopUpdateBanner" hidden role="status" aria-live="polite">
  <div class="update-banner-copy">
    <strong id="desktopUpdateTitle">New version available</strong>
    <span id="desktopUpdateDetail" class="muted">Click Download to fetch the latest release directly from GitHub.</span>
  </div>
  <div class="update-banner-actions">
    <button type="button" class="button compact" id="btnDesktopDownloadUpdate">Download update</button>
    <button type="button" class="button compact" id="btnDesktopInstallUpdate" hidden>Install &amp; relaunch</button>
    <button type="button" class="button secondary compact" id="btnDesktopOpenUpdate" hidden>Open package</button>
    <button type="button" class="button quiet compact" id="btnDesktopDismissUpdate">Later</button>
  </div>
</div>

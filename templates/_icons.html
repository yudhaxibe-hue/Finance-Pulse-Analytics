{% macro brand_mark(size=28) -%}
<svg class="brand-glyph" width="{{ size }}" height="{{ size }}" viewBox="0 0 28 28" fill="none" aria-hidden="true">
  <rect x="0.5" y="0.5" width="27" height="27" rx="7.5" fill="var(--brand-bg, #1D1D1F)" stroke="rgba(255,255,255,0.12)"/>
  <path d="M5.5 16.5H9.2L11.6 10.5L14.8 19.2L17.9 8.8L20.1 14.5H22.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="22.5" cy="14.5" r="1.4" fill="#3B9BFF"/>
</svg>
{%- endmacro %}

{% macro icon(name, size=16) -%}
<svg class="ui-icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if name == 'dashboard' %}
    <rect x="2.75" y="2.75" width="6.25" height="6.25" rx="1.5"/>
    <rect x="11" y="2.75" width="6.25" height="4.25" rx="1.5"/>
    <rect x="11" y="9" width="6.25" height="8.25" rx="1.5"/>
    <rect x="2.75" y="11" width="6.25" height="6.25" rx="1.5"/>
  {% elif name == 'overview' %}
    <path d="M3 15.5H17"/>
    <path d="M4.5 12L8.2 8.2L11.2 10.7L15.8 5.2"/>
    <path d="M13 5.2H15.8V8"/>
  {% elif name == 'products' %}
    <path d="M10 2.75L16.25 6.25V13.75L10 17.25L3.75 13.75V6.25L10 2.75Z"/>
    <path d="M3.75 6.25L10 9.75L16.25 6.25"/>
    <path d="M10 9.75V17.25"/>
  {% elif name == 'departments' %}
    <rect x="3.5" y="3" width="13" height="14" rx="1.75"/>
    <path d="M7.5 17V13.5H12.5V17"/>
    <path d="M7.25 6.75H8.5M11.5 6.75H12.75M7.25 10H8.5M11.5 10H12.75"/>
  {% elif name == 'categories' %}

    <circle cx="7" cy="7" r="0.9" fill="currentColor" stroke="none"/>
  {% elif name == 'regions' %}
    <circle cx="10" cy="10" r="7"/>
    <ellipse cx="10" cy="10" rx="3.1" ry="7"/>
    <path d="M3.4 10H16.6"/>
  {% elif name == 'anomalies' %}
    <path d="M10 3.2L17 15.75H3L10 3.2Z"/>
    <path d="M10 8V11.4"/>
    <circle cx="10" cy="13.6" r="0.7" fill="currentColor" stroke="none"/>
  {% elif name == 'forecasting' %}
    <path d="M3 16.25H17"/>
    <path d="M4.25 13L8.25 9.5L11.25 11.2"/>
    <path d="M11.25 11.2L16.25 5.2" stroke-dasharray="2.2 2.2"/>

  {% elif name == 'optimization' %}
    <path d="M3.5 6H16.5M3.5 14H16.5M3.5 10H16.5"/>
    <circle cx="7" cy="6" r="1.7" fill="var(--bg-surface, #FFFFFF)"/>
    <circle cx="13" cy="10" r="1.7" fill="var(--bg-surface, #FFFFFF)"/>
    <circle cx="8.5" cy="14" r="1.7" fill="var(--bg-surface, #FFFFFF)"/>
  {% elif name == 'data' %}

    <circle cx="14.2" cy="7.8" r="1.8"/>
    <path d="M14.2 12.1C15.8 12.3 16.9 13.5 17.2 15.6"/>

  {% elif name == 'settings' %}

  {% elif name == 'logout' %}

  {% elif name == 'user-plus' %}
    <circle cx="8" cy="7" r="2.6"/>

    <path d="M15 8V13M12.5 10.5H17.5"/>
  {% elif name == 'chevron-right' %}
    <path d="M7.5 5.2L12.5 10L7.5 14.8"/>
  {% elif name == 'arrow-right' %}
    <path d="M4.2 10H15.8M11.6 5.8L15.8 10L11.6 14.2"/>
  {% elif name == 'menu' %}

    <circle cx="15.8" cy="5.5" r="1.2" fill="currentColor" stroke="none"/>
  {% elif name == 'audit' %}
    <path d="M5.5 3.5H12.5L15.5 6.5V16.5H5.5V3.5Z"/>
    <path d="M12.2 3.5V6.8H15.5"/>
    <path d="M8 10.2H13M8 13.2H11.5"/>
  {% endif %}
</svg>
{%- endmacro %}
